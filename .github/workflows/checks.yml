name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Verify generated README figures
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: |
          node docs/figures/render.cjs --check
          node docs/figures/render-research.cjs --check
          node docs/figures/render-v1.cjs --check
          node docs/figures/render-independent.cjs --check
          node docs/figures/render-competitor.cjs --check
          node docs/figures/render-v12.cjs --check
      - name: Smoke-test committed skill package
        if: runner.os == 'Linux' && matrix.python == '3.13'
        shell: bash
        run: |
          if [[ -f VERSION ]]; then
            python tools/build_release.py --commit "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/skill-smoke"
            cd "$RUNNER_TEMP/skill-smoke"
            sha256sum --check ./*.sha256
          fi
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s examples/streaming-metrics -v
      - name: Record, review, retrieve and verify a reproducible repair case
        if: runner.os == 'Linux'
        shell: bash
        run: |
          case_dir="$RUNNER_TEMP/research-to-fix-case"
          script_dir=skills/research-to-fix/scripts
          python examples/streaming-metrics/record_case.py --output "$case_dir"
          python "$script_dir/research_case.py" validate "$case_dir/case.json" --format json
          python "$script_dir/research_case.py" review "$case_dir/case.json" --format json > "$RUNNER_TEMP/research-to-fix-review.json"
          python "$script_dir/research_case.py" recall --cases-dir "$case_dir" --error 'single-use iterator count mean' --format json > "$RUNNER_TEMP/research-to-fix-recall.json"
          artifacts=()
          for phase in before after; do
            for snapshot in metrics.py test_metrics.py test_metrics_streaming.py _record_tests.py; do
              artifacts+=(--artifact "runs/$phase/$snapshot")
            done
          done
          python "$script_dir/case_bundle.py" seal --directory "$case_dir" "${artifacts[@]}" > "$RUNNER_TEMP/research-to-fix-seal.json"
          manifest_hash=$(python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["manifest_sha256"])' "$RUNNER_TEMP/research-to-fix-seal.json")
          python "$script_dir/case_bundle.py" verify --directory "$case_dir" --expected-manifest-sha256 "$manifest_hash" > "$RUNNER_TEMP/research-to-fix-verify.json"
      - name: Save example run artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repair-case-python-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/research-to-fix-case/
            ${{ runner.temp }}/research-to-fix-recall.json
            ${{ runner.temp }}/research-to-fix-review.json
            ${{ runner.temp }}/research-to-fix-seal.json
            ${{ runner.temp }}/research-to-fix-verify.json
          retention-days: 7
          if-no-files-found: error

  release:
    # A reviewed main-branch version change is the explicit publication trigger.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Detect explicit version change
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f VERSION ]] || git diff --quiet HEAD^1 HEAD -- VERSION; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f "docs/releases/v$version.md"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: steps.version.outputs.publish == 'true'
        with:
          python-version: '3.13'
      - name: Verify release quality and build exact-commit package
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/release-validation"
          mkdir "$d"
          python benchmarks/retrieval.py --k 5 --output "$d/retrieval.json"
          python benchmarks/retrieval.py --github-titles --k 5 --output "$d/github.json"
          python benchmarks/scale.py --output "$d/scale.json"
          python benchmarks/regression.py --synthetic "$d/retrieval.json" --github "$d/github.json" --scale "$d/scale.json" --output "$d/regression.json"
          python benchmarks/discovery.py --output "$d/discovery.json"
          python benchmarks/discovery.py --dataset transfer --output "$d/transfer.json"
          python benchmarks/discovery_regression.py --original "$d/discovery.json" --transfer "$d/transfer.json" --output "$d/discovery-regression.json"
          python examples/numerical-variance/compare_methods.py --output "$d/variance"
          python examples/exact-attention/compare_attention.py --output "$d/attention"
          python tools/build_release.py --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          sha256sum --check ./*.sha256
      - name: Publish release without replacing an existing tag
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          # Exit 2 means no matching tag; any other transport failure aborts.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag"; then
            echo "Tag already exists; refusing to overwrite." >&2
            exit 1
          else
            status=$?
            test "$status" -eq 2
          fi
          file="$RUNNER_TEMP/release/research-to-fix-$tag-skill.zip"
          gh release create "$tag" "$file" "$file.sha256" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Research to Fix $tag" --notes-file "docs/releases/$tag.md"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,url,isDraft,isPrerelease,assets
