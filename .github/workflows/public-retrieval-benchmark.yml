name: Public BEIR benchmark

on:
  push:
    paths:
      - 'benchmarks/fetch_beir.py'
      - '.github/workflows/public-retrieval-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Download pinned public data
        run: python benchmarks/fetch_beir.py --output "$RUNNER_TEMP/beir-programmers"
      - name: Install optional benchmark dependency
        run: python -m pip install --only-binary=:all: pyarrow==20.0.0
      - name: Evaluate fixed public query sample
        run: python benchmarks/retrieval.py --beir-dir "$RUNNER_TEMP/beir-programmers" --query-limit 128 --k 10 --repeats 2 --output "$RUNNER_TEMP/beir-retrieval.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beir-programmers-metrics
          path: ${{ runner.temp }}/beir-retrieval.json
          retention-days: 30
          if-no-files-found: error
