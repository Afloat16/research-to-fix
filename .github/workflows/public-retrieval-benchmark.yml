name: Public BEIR retrieval benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/public-retrieval-benchmark.yml'
permissions:
  contents: read
jobs:
  beir-programmers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install benchmark-only Parquet reader
        run: python -m pip install --only-binary=:all: pyarrow==20.0.0
      - name: Fetch pinned public dataset (CC BY-SA 4.0)
        shell: bash
        run: |
          data="$RUNNER_TEMP/beir-programmers"
          mkdir "$data"
          base=https://huggingface.co/datasets/BeIR/cqadupstack/resolve/e84b7220ce5a4e6c49aeb568983b0ec5a7584c2c/programmers
          qrels=https://huggingface.co/datasets/BeIR/cqadupstack-qrels/resolve/2b9f5791698b5be7bc5e10535c8690f20043c3db/programmers/test.tsv
          curl --fail --location --retry 2 --max-time 120 "$base/corpus/corpus-00000-of-00001.parquet" -o "$data/corpus.parquet"
          curl --fail --location --retry 2 --max-time 120 "$base/queries/queries-00000-of-00001.parquet" -o "$data/queries.parquet"
          curl --fail --location --retry 2 --max-time 120 "$qrels" -o "$data/test.tsv"
          cd "$data"
          printf '%s\n' 'b8eefa212252fe5af6ee72ba530df053740ff30c2c0bea77089f8a9271e94f75  corpus.parquet' '106ba4777034ccec608a623ac93b5cfad63d89effc64d0528759ea94e276345d  queries.parquet' | sha256sum --check
          sha256sum test.tsv
      - name: Evaluate full corpus on fixed 128-query sample
        run: python benchmarks/retrieval.py --beir-dir "$RUNNER_TEMP/beir-programmers" --query-limit 128 --k 10 --repeats 2 --output "$RUNNER_TEMP/beir-retrieval.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beir-programmers-metrics
          path: ${{ runner.temp }}/beir-retrieval.json
          retention-days: 30
          if-no-files-found: error
