<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="694" viewBox="0 0 1200 694" role="img" aria-labelledby="title desc"><title id="title">研究与多方案决策</title><desc id="desc">研究工作流、八个算法问题的来源排序对照与五次方差修复实测。开发样本，不代表实时检索成功率。</desc><rect x="0" y="0" width="1200" height="694" rx="12" fill="#F5F8FB" stroke="#D9E3EC"/><text x="30" y="39" font-family="Inter, Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="700" fill="#18334D" text-anchor="start">从论文与开源实现，到可验证的算法决策</text><text x="30" y="65" font-family="Inter, Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="400" fill="#526579" text-anchor="start">研究覆盖 → 证据核验 → 同协议实验 → 有条件的最佳方案</text><rect x="30" y="89" width="164" height="76" rx="8" fill="#fff" stroke="#D9E3EC"/><text x="112" y="114" font-family="Inter, Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#18334D" text-anchor="middle">问题指纹</text><text x="112" y="141" font-family="Inter, Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#526579" text-anchor="middle">任务 / 版本 / 约束</text><path d="M199 127h22l-7 -6m7 6l-7 6" fill="none" stroke="#007F83" stroke-width="2.2" stroke-linejoin="round"/><rect x="225" y="89" width="164" height="76" rx="8" fill="#fff" stroke="#D9E3EC"/><text x="307" y="114" font-family="Inter, Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#18334D" text-anchor="middle">研究计划</text><text x="307" y="141" font-family="Inter, Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#526579" text-anchor="middle">机制 / 替代 / 反证</text><path d="M394 127h22l-7 -6m7 6l-7 6" fill="none" stroke="#007F83" stroke-width="2.2" stroke-linejoin="round"/><rect x="420" y="89" width="164" height="76" rx="8" fill="#fff" stroke="#D9E3EC"/><text x="502" y="114" font-family="Inter, Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', s