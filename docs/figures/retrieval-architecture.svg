<text x="57" y="301" font-family="Inter, Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" font-weight="400" fill="#526579" text-anchor="start">Deduplication + tokenization</text>
