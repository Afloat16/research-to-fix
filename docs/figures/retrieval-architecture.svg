<text x="613" y="322" font-family="Inter, Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="21" font-weight="700" fill="#18334D" text-anchor="start">Packed postings</text>
