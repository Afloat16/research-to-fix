<text x="380" y="233" font-size="16" fill="#c8d5e6" font-weight="500" text-anchor="start">样本峰值分配减少</text>
<rect x="688" y="153" width="316" height="106" rx="14" fill="#1e2d43"/>
<text x="706" y="201" font-size="35" fill="#72e0d3" font-weight="730" text-anchor="start">288/288</text>
