<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 690" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<title id="title">精确召回加速实测</title>
<desc id="desc">五千篇生成文档，六种负载，完整结果一致。横条表示中位延迟加速倍数；内存是单查询样本。</desc>
<rect x="0" y="0" width="1040" height="690" rx="22" fill="#101a2c"/>
<text x="36" y="42" font-size="15" fill="#69d6cf" font-weight="700" text-anchor="start">RESEARCH TO FIX  /  v1.2.0</text>
<text x="36" y="92" font-size="42" fill="#ffffff" font-weight="750" text-anchor="start">相同结果，更少计算。</text>
<text x="36" y="126" font-size="19" fill="#b2c3d9" font-weight="400" text-anchor="start">精确阈值计数 + 有界 Top-K + 延迟解释</text>
