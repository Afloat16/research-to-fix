<text x="54" y="201" font-size="35" fill="#72e0d3" font-weight="730" text-anchor="start">2.85–4.83×</text>
<text x="54" y="233" font-size="16" fill="#c8d5e6" font-weight="500" text-anchor="start">P50 召回速度提升</text>
