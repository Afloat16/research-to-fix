<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 735" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<title id="title">真实 Mathematica 检索迁移对照</title>
<desc id="desc">八种方法的 nDCG@10，展示全部结果及真实查询的严格一致性和加速；不代表实际修复率。</desc>
<rect x="0" y="0" width="1040" height="735" rx="22" fill="#101a2c"/>
<text x="36" y="42" font-size="15" fill="#69d6cf" font-weight="700" text-anchor="start">RESEARCH TO FIX  /  EXTERNAL TRANSFER</text>
<text x="36" y="90" font-size="38" fill="#ffffff" font-weight="750" text-anchor="start">真实语料，全部对照。</text>
<text x="36" y="124" font-size="18" fill="#b2c3d9" font-weight="400" text-anchor="start">BEIR Mathematica · 16,705 篇文档 · 804 条测试查询 · 预先冻结方法</text>
<rect x="36" y="151" width="316" height="102" rx="14" fill="#1e2d43"/>
<text x="54" y="199" font-size="35" fill="#72e0d3" font-weight="730" text-anchor="start">4.88×</text>
<text x="54" y="231" font-size="16" fill="#c8d5e6" font-weight="500" text-anchor="start">精确召回 P50 加速</text>
