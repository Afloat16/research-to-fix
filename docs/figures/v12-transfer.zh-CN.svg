<text x="380" y="199" font-size="35" fill="#72e0d3" font-weight="730" text-anchor="start">804/804</text>
<text x="380" y="231" font-size="16" fill="#c8d5e6" font-weight="500" text-anchor="start">完整输出一致</text>
<rect x="688" y="151" width="316" height="102" rx="14" fill="#1e2d43"/>
<text x="706" y="199" font-size="35" fill="#72e0d3" font-weight="730" text-anchor="start">0.2366</text>
