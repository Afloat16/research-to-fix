<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 690" role="img" aria-labelledby="title desc" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<title id="title">v1.3 real execution and evidence review</title>
<desc id="desc">Three bounded experiments: actual local Python subprocesses, named evidence perturbations and simulated search statuses.</desc>
